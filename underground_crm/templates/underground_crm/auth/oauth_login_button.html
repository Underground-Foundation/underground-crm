{% load i18n static socialaccount %}

  <img src="{% static image_src %}" alt="" aria-hidden="true" width="20" height="20" class="mr-2">
  {% blocktrans with provider=provider_name %}Log in with {{ provider }}{% endblocktrans %}
</a>
