{% extends "underground_crm/basic_page.html" %}
{% load i18n %}

{% block extra_body_content %}
  <div class="form-page-form my-4">
    {% if submitted %}
      <p class="alert alert-success" role="status">
        {% trans "Thanks — your response has been recorded." %}
      </p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">{% trans "Submit" %}</button>
    </form>
  </div>
{% endblock %}
