# Dependabot version updates, checked weekly. The format is defined at
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Security updates are a separate feature, which is enabled in the repository's settings
# (Code security → Dependabot security updates) and needs nothing in this file.
version: 2

updates:
  # pyproject.toml gives each dependency a range and there is no lockfile, so pip already
  # installs the newest version that each range allows. Dependabot opens a pull request
  # only when a release falls outside a range, which for an upper bound such as
  # "django-q2>=1.10,<2" is the deliberate step that the comment above it describes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # The services in docker-compose.yml, which development runs against. ci.yml defines its
  # own services, which Dependabot does not update.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Addressr is the only service that uses OpenSearch, so a new major version needs
      # Addressr's support for it confirmed first.
      - dependency-name: "opensearchproject/opensearch"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
