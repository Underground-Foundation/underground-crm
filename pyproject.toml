[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "underground-crm"
version = "0.1.0"
description = "Open-source CRM and CMS toolkit for political parties and grassroots movements"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = [
    "blessed",
    "cachetools>=5.5",
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-colorfield",
    "django-money>=3.0",
    # Upper bound because underground_crm/error_reporting.py identifies a failed task by
    # walking the worker's stack for a local variable named "task" — an internal detail of
    # django_q/worker.py, not a public API. If a future release renames it the reporter
    # still sends the exception but loses the task name/id/func on every event, which is a
    # silent degradation exactly when a failure is being investigated. A major-version bump
    # should be a deliberate step that re-runs test_error_reporting.py's canary.
    "django-q2>=1.10,<2",
    "django-phonenumber-field[phonenumbers]",
    "dnspython>=2.0",
    "email-validator",
    "feedparser>=6.0",
    "Pillow>=10.0",
    "psycopg[binary]",
    "python-dateutil>=2.9.0.post0,<3.0",
    "redis",
    "requests>=2.31",
    # 2.35 promoted enable_logs to a top-level sentry_sdk.init() option; before that it
    # lived under _experiments. Sending log records (not just error events) to GlitchTip
    # depends on it, so an older SDK would silently forward nothing to the log view.
    "sentry-sdk>=2.35",
    "smtp2go",
    "stripe>=8.0",
    "wagtail>=6.0,<7.0",
    "django-taggit>=6.0",
    "django-simple-history",
    "django-allauth[socialaccount]>=65.0",
    "django-compressor>=4.0",
    "csscompressor>=0.9",
    "whitenoise>=6.0",
    # Faster collectstatic against a remote (S3/R2) staticfiles bucket: skips a file whose
    # checksum already matches the stored object. Unmaintained upstream (last release 2021)
    # but small and self-contained, and it works by subclassing Django's own collectstatic
    # command — so a Django upgrade is what to re-test it against. Pulls in django-storages,
    # which until now only the theme project depended on. Does nothing unless the deployment
    # sets COLLECTFAST_ENABLED — see underground_crm/settings.py.
    "Collectfast>=2.2,<3",
]

# django-q2 resolves Q_CLUSTER["error_reporter"] keys through this entry point group,
# so the reporter has to be advertised here rather than named by import path in settings.
[project.entry-points."djangoq.errorreporters"]
underground_crm = "underground_crm.error_reporting:QueuedTaskReporter"

[project.optional-dependencies]
dev = [
    "pylint>=3.0",
    "pylint-django>=2.5",
    "black>=25.0",
    "pre-commit>=4.0",
]
migration = [
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["underground_crm*", "underground_email*", "underground_payments*"]

# Without this, a *non-editable* install of this package ships Python modules only: the
# built wheel contained 145 entries and zero templates. That is invisible during local
# development, where `pip install -e ../underground-crm` puts the working tree itself on
# the path so every file is reachable regardless of packaging — but it means a consumer
# installing from a git URL (fusion-underground's requirements-production.txt, which the
# production Docker image builds from) would get a Django app whose every
# TemplateDoesNotExist is raised at the first request.
#
# `include-package-data` defaults to true for pyproject.toml-based builds, but that only
# admits files a MANIFEST.in or a setuptools VCS plugin already selected, and this project
# has neither — so the paths must be named explicitly here.
#
# Test fixtures (underground_crm/management/commands/test/*.html,
# underground_email/test/click_sample.json) are deliberately left out: they are only read
# by the test suite, which runs from a checkout, never from an installed wheel.
[tool.setuptools.package-data]
"*" = [
    "templates/**/*.html",
    "static/**/*",
    "locale/**/*.po",
    "locale/**/*.mo",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pylint.main]
load-plugins = ["pylint_django", "pylint_wagtail"]
# pylint_wagtail lives at the repo root rather than inside the distributed package, so
# it has to be put on the import path before pylint loads its plugins. pre-commit and
# CI both run pylint from the repo root.
init-hook = "import sys; sys.path.insert(0, '.')"
django-settings-module = "underground_crm.settings"
# Migrations are auto-generated; the migration/ dir contains standalone scripts
# that import a config module not on the pylint path.
ignore-paths = [
    "underground_crm/migrations",
    "migration",
]

[tool.pylint.format]
# Allow slightly more room than black's 100 so comments and warning strings
# in f-strings don't trip the linter; black still enforces 100 for real code.
max-line-length = 120

[tool.pylint.design]
# Wagtail pages inherit from long chains (Page → BasicPage → UndergroundBasicPage → …).
max-parents = 20
# Management commands are intentionally large procedural functions.
max-locals = 25
max-branches = 25
max-statements = 90

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # TODO comments are intentional — tracked in code, not in a ticket system.
    "fixme",
    # duplicate-code fires across management commands that share urllib boilerplate;
    # that code will be consolidated when the commands are refactored.
    "duplicate-code",
]
